[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spief-rag"
version = "1.0.0"
description = "Grounded GigaChat assistant over SPIEF transcripts with reproducible cost evaluation"
authors = [{name = "Иван Лазичный"}]
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pydantic>=2.7,<3", "httpx>=0.27,<1", "certifi>=2024", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.9,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
spief-rag = "spief_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
